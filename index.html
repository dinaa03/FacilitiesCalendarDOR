<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridgewater NDC · Facilities Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <div class="eyebrow">Bridgewater NDC</div>
          <h1 class="title">Facilities Calendar</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="now">
          <div id="nowTime" class="now-time"></div>
          <div id="nowDate" class="now-date"></div>
        </div>
        <button id="addBtn" class="btn btn-add"><span class="plus">+</span> Add</button>
      </div>
    </header>

    <nav class="toolbar">
      <div class="nav">
        <button id="prevBtn" class="btn btn-icon" aria-label="Previous">‹</button>
        <button id="nextBtn" class="btn btn-icon" aria-label="Next">›</button>
        <button id="todayBtn" class="btn btn-outline">Today</button>
        <div id="periodLabel" class="period"></div>
      </div>
      <div class="toolbar-right">
        <div class="seg filters" id="filterSeg">
          <button data-filter="all" class="active">All</button>
          <button data-filter="event"><span class="dot event"></span>Events</button>
          <button data-filter="contractor"><span class="dot contractor"></span>Contractors</button>
          <button data-filter="pto"><span class="dot pto"></span>PTO / OOO</button>
        </div>
        <div class="seg" id="viewSeg">
          <button data-view="month" class="active">Month</button>
          <button data-view="week">Week</button>
          <button data-view="day">Day</button>
        </div>
      </div>
    </nav>

    <section class="today" id="todayBox">
      <button class="today-toggle" id="todayToggle">
        <span class="today-label">Today</span>
        <span id="todayCounts" class="today-counts"></span>
        <span class="chev">⌄</span>
      </button>
      <div class="today-body" id="todayBody"></div>
    </section>

    <main id="calendar" class="calendar"></main>
    <footer class="status-bar">
      <span id="syncBadge" class="sync"></span>
      <span id="status" class="status"></span>
    </footer>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
